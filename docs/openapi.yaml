openapi: 3.1.0
info:
  title: Notification Preferences Service
  version: 1.0.0
  description: >
    Единый источник правды о том, какие типы уведомлений и по каким каналам
    можно отправлять пользователю. Объединяет дефолты, индивидуальные настройки,
    глобальные политики и quiet hours.
servers:
  - url: http://localhost:3000
    description: Локальный

paths:
  /health:
    get:
      summary: Проверка доступности
      operationId: health
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                required: [status]

  /users/{id}/preferences:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      summary: Получить эффективные настройки пользователя
      operationId: getPreferences
      description: >
        Возвращает матрицу дефолтов с применёнными переопределениями пользователя.
        Любой id валиден; неизвестный пользователь резолвится в дефолты.
      responses:
        "200":
          description: Эффективные настройки и quiet hours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
    post:
      summary: Обновить настройки и/или quiet hours пользователя
      operationId: updatePreferences
      description: >
        Оба верхнеуровневых ключа необязательны. Отсутствие quietHours оставляет
        его без изменений; null очищает; объект заменяет. Запись идемпотентна:
        повтор того же тела приводит к тому же состоянию.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesRequest"
            examples:
              disableMarketingEmail:
                value:
                  preferences:
                    - notificationType: marketing
                      channel: email
                      enabled: false
              setQuietHours:
                value:
                  quietHours:
                    timezone: Europe/Berlin
                    start: "22:00"
                    end: "08:00"
              clearQuietHours:
                value:
                  quietHours: null
      responses:
        "200":
          description: Обновлённые эффективные настройки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "400":
          $ref: "#/components/responses/ValidationError"

  /evaluate:
    post:
      summary: Решить, можно ли отправить уведомление
      operationId: evaluate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateRequest"
            examples:
              blockedInEu:
                value:
                  userId: u123
                  notificationType: marketing
                  channel: sms
                  region: EU
                  datetime: "2026-06-06T21:30:00Z"
      responses:
        "200":
          description: Решение
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1

  schemas:
    Channel:
      type: string
      enum: [email, sms, push, messenger]
    NotificationType:
      type: string
      enum: [transactional, security, system, marketing, promotional]
    PreferenceSource:
      type: string
      enum: [default, user, unset]
    Decision:
      type: string
      enum: [allow, deny]
    DecisionReason:
      type: string
      enum:
        - allowed
        - blocked_by_global_policy
        - disabled_by_user
        - disabled_by_default
        - quiet_hours
        - not_configured

    QuietHours:
      type: object
      description: Окно локального времени в таймзоне IANA. Может переходить через полночь.
      properties:
        timezone:
          type: string
          example: Europe/Berlin
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "22:00"
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "08:00"
      required: [timezone, start, end]

    ResolvedPreference:
      type: object
      properties:
        notificationType:
          $ref: "#/components/schemas/NotificationType"
        channel:
          $ref: "#/components/schemas/Channel"
        enabled:
          type: boolean
        source:
          $ref: "#/components/schemas/PreferenceSource"
      required: [notificationType, channel, enabled, source]

    UserPreferences:
      type: object
      properties:
        userId:
          type: string
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedPreference"
        quietHours:
          oneOf:
            - $ref: "#/components/schemas/QuietHours"
            - type: "null"
      required: [userId, preferences, quietHours]

    PreferenceUpsert:
      type: object
      properties:
        notificationType:
          $ref: "#/components/schemas/NotificationType"
        channel:
          $ref: "#/components/schemas/Channel"
        enabled:
          type: boolean
      required: [notificationType, channel, enabled]

    UpdatePreferencesRequest:
      type: object
      properties:
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/PreferenceUpsert"
        quietHours:
          oneOf:
            - $ref: "#/components/schemas/QuietHours"
            - type: "null"
      additionalProperties: false

    EvaluateRequest:
      type: object
      properties:
        userId:
          type: string
          minLength: 1
        notificationType:
          $ref: "#/components/schemas/NotificationType"
        channel:
          $ref: "#/components/schemas/Channel"
        region:
          type: string
          minLength: 1
          description: Произвольный код региона, нормализуется к верхнему регистру.
        datetime:
          type: string
          format: date-time
      required: [userId, notificationType, channel, region, datetime]

    EvaluateResponse:
      type: object
      properties:
        decision:
          $ref: "#/components/schemas/Decision"
        reason:
          $ref: "#/components/schemas/DecisionReason"
      required: [decision, reason]

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
          required: [code, message]
      required: [error]

  responses:
    ValidationError:
      description: Некорректное тело запроса
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
